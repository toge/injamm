  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-emscripten-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-emscripten-vcpkg-
      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi
      - name: Configure
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DBUILD_EXAMPLE=OFF \
            -DBUILD_FUZZ=OFF
      - name: Build
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake --build build
      - name: Test
        run: |
          source /opt/emsdk/emsdk_env.sh
          ctest --test-dir build -V

  linux-wasip1:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y cmake ninja-build git curl zip unzip tar python3 gcc-c++ file

      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-34.0

      - name: Install wasi-sdk
        run: |
          if [ ! -d /opt/wasi-sdk/bin/clang ]; then
            curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o /tmp/wasi-sdk.tar.gz
            mkdir -p /opt/wasi-sdk && tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          fi
          /opt/wasi-sdk/bin/clang --version

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-wasip1-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-wasip1-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Install wasmtime
        run: |
          WASMTIME_VERSION=$(curl -s https://api.github.com/repos/bytecodealliance/wasmtime/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/latest/download/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" -o /tmp/wasmtime.tar.xz
          tar -xf /tmp/wasmtime.tar.xz -C /tmp
          WASMTIME_DIR="/tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux"
          echo "${WASMTIME_DIR}" >> $GITHUB_PATH
          "${WASMTIME_DIR}/wasmtime" --version

      - name: Build WASM with vcpkg + wasi-sdk (wasip1, -fno-exceptions)
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-wasip1 \
            -DVCPKG_OVERLAY_TRIPLETS=$PWD/triplets \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake \
            -DCMAKE_CXX_FLAGS="-fno-exceptions -fno-rtti" \
            -DBUILD_TEST=OFF \
            -DBUILD_EXAMPLE=OFF
          cmake --build build
          file build/test_no_exceptions | grep -q WebAssembly

      - name: Run WASM binary with wasmtime (wasip1)
        run: wasmtime run build/test_no_exceptions

      - name: Verify no direct throw/try/catch (except helpers)
        run: |
          echo "Checking that raw throw only appears via INJAMM_THROW in ct/parse/config..."
          ! grep -rn -E '\bthrow\b' include/injamm --include="*.hpp" | grep -v "INJAMM_THROW" | grep -v -E 'ct_chunk\.hpp|ct_parse\.hpp|config\.hpp' || { echo "Found raw throw outside ct_chunk/ct_parse/config"; exit 1; }
          echo "Checking that try/catch only live in allowlisted OOM guards..."
          ! grep -rn -E '\btry\b|\bcatch\b' include/injamm --include="*.hpp" | grep -v -E 'bytecode_io\.hpp|serialize_value\.hpp|bytecode_exec\.hpp|bytecode_compile\.hpp|types\.hpp|bytecode_debug\.hpp' || { echo "Found try/catch outside allowlist"; exit 1; }
          echo "Checking that hot paths stay try/catch-free (coarse-guard policy)..."
          ! grep -rn -E '\btry\b|\bcatch\b' include/injamm/filters.hpp || { echo "Found try/catch in filters.hpp hot path"; exit 1; }
          echo "ok"

